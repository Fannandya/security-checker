services:
  osc-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: osc-web:latest
    container_name: osc-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ${OSC_OUTPUT_PATH:-/opt/osc/output}:/app/output
    environment:
      - OSC_OUTPUT_DIR=/app/output
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
