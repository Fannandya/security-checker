name: Deploy to LXC 10015

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-lxc10015
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: [self-hosted, lxc10015]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Test Suite
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev,web]"
          .venv/bin/pytest -v

      - name: Backup Current Running Image
        run: |
          if docker image inspect osc-web:latest >/dev/null 2>&1; then
            echo "[*] Backing up current osc-web:latest to osc-web:backup..."
            docker tag osc-web:latest osc-web:backup
          fi

      - name: Build & Deploy Container Locally
        run: |
          docker compose up -d --build --remove-orphans

      - name: Health Check Verification
        run: |
          echo "[*] Waiting for OSC Web Scanner to be healthy on port 8000..."
          for i in {1..20}; do
            if curl -s -f http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'; then
              echo "[+] Health check PASSED! Service online."
              exit 0
            fi
            echo "Waiting for service... ($i/20)"
            sleep 2
          done
          echo "[-] Health check failed! Initiating rollback..."
          if docker image inspect osc-web:backup >/dev/null 2>&1; then
            docker tag osc-web:backup osc-web:latest
            docker compose up -d
            echo "[+] Rolled back to osc-web:backup successfully."
          fi
          echo "[-] Container logs:"
          docker compose logs --tail=50
          exit 1
